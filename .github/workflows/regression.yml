name: Playwright Regression Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 * *'

jobs:
  regression:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: pw-tests:latest
          load: true
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: Run quality gates
        run: |
          docker run pw-tests npm run lint
          docker run pw-tests npm run format:check
          docker run pw-tests npm run typecheck

      - name: Run regression tests
        run: |
          docker run \
            -e CI=true \
            -e NODE_ENV=dev \
            -e USERNAME=${{ secrets.USERNAME }} \
            -e PASSWORD=${{ secrets.PASSWORD }} \
            -e BASE_URL=${{ secrets.BASE_URL }} \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            pw-tests \
            npx playwright test -g "@regression" --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: regression-${{ github.run_id }}-shard-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
